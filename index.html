<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111a3a;--a:#2f5bea;--mut:#5b6785;--line:#e6e9f2;--soft:#f5f7fc;--sh:0 12px 32px rgba(17,26,58,.09);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.in{max-width:1080px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .in{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.mono{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.brand b{display:block;font-size:15px;line-height:1.25}
.brand small{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tabs{display:flex;gap:4px}
.tabs a{text-decoration:none;color:var(--mut);font-size:15px;padding:8px 14px;border-radius:999px;transition:.2s}
.tabs a.on{color:var(--ink);font-weight:600;background:var(--soft)}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:15px;padding:12px 24px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(17,26,58,.05);transition:.2s}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 22px rgba(17,26,58,.25)}
.btn:hover{transform:translateY(-2px)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:64px 0 72px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;color:#9a6a00;background:#fff8e6;border:1px solid #f3e0a8;padding:5px 13px;border-radius:999px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.07;font-weight:800;letter-spacing:-.03em;margin:20px 0 18px}
.hl{color:var(--a)}
.lead{font-size:15px;color:var(--mut);max-width:52ch;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.pc{position:relative;max-width:420px;width:100%;margin:0 auto}
.pc::before{content:"";position:absolute;inset:-10px -12px 12px 12px;background:#dbe4fb;border-radius:32px;transform:rotate(2.5deg)}
.pcin{position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#5f7ee6,#2a3a86 70%,#141b45);box-shadow:var(--sh)}
.pcin::after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,rgba(10,16,40,.88))}
.ph{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:24px;bottom:22px;right:24px;z-index:2;color:#fff}
.cap b{display:block;font-size:20px}
.cap span{font-size:14px;opacity:.8}
.fig{position:absolute;left:50%;bottom:17%;width:64%;transform:translateX(-50%);animation:bob 5s ease-in-out infinite}
.fig svg,.ic svg{display:block;width:100%;height:auto}
.ic{position:absolute;z-index:3;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(17,26,58,.25))}
.wave{animation:wave 1.6s ease-in-out infinite}
.stats{background:var(--soft);border-block:1px solid var(--line)}
.stats .in{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{text-align:center;padding:26px 8px;border-left:1px solid var(--line)}
.stats div:first-child{border:0}
.stats b{display:block;font-size:clamp(26px,5vw,38px);letter-spacing:-.02em}
.stats span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sec{padding:72px 0 0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h2{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em;line-height:1.15;margin:0}
.sub{color:var(--mut);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin-top:30px}
.card{display:flex;flex-direction:column;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 10px 20px;box-shadow:0 4px 14px rgba(17,26,58,.05);transition:.25s}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.im{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#e3e9fb,#eee7fb);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--a)}
.im img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:18px;line-height:1.35;margin:16px 10px 4px}
.card p{margin:0 10px 10px;color:var(--mut);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .mut{margin:auto 10px 0}
.mut{font-size:13px;color:var(--mut)}
.more{color:var(--a);font-weight:600;text-decoration:none}
.band{background:#111a3a;color:#fff;margin-top:80px;padding:72px 0}
.band .k{font-size:12px;letter-spacing:.14em;color:#8fa8ff;font-weight:600;text-transform:uppercase}
.band h2{margin:12px 0 22px}
.band p{color:#c3cbe6;max-width:64ch;margin:0 0 1em}
.pg{padding:44px 0 0}
.pg h1{font-size:clamp(30px,5vw,46px);margin:18px 0 8px}
.hero-img{width:100%;max-height:440px;object-fit:cover;border-radius:22px;margin:22px 0;box-shadow:var(--sh)}
.pdf{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:22px;margin:24px 0}
.body p{max-width:66ch;font-size:17px}
footer{margin-top:72px;padding:26px 0;border-top:1px solid var(--line);text-align:center}
@keyframes bob{50%{transform:translateX(-50%) translateY(-8px)}}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes wave{50%{transform:rotate(-14deg)}}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:44px;padding:40px 0 56px}.brand small{max-width:110px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.body h2{font-size:26px;margin:1.8em 0 .5em;letter-spacing:-.01em}
.body h3{font-size:20px;margin:1.5em 0 .4em}
.body img{max-width:100%;height:auto;border-radius:14px;display:block;margin:1.2em auto}
.body figure{margin:1.4em 0}.body figcaption{font-size:13px;color:var(--mut);text-align:center}
.body blockquote{margin:1.4em 0;padding:.2em 0 .2em 1.2em;border-left:3px solid var(--a);color:var(--mut)}
.body a{color:var(--a)}.body ul,.body ol{max-width:66ch;padding-left:1.3em}
.body pre{overflow-x:auto;background:var(--soft);padding:14px;border-radius:12px}
.src{display:inline-block;margin:6px 0 0;font-size:14px;font-weight:600;color:var(--a);text-decoration:none}
.follow{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-top:36px}
.follow p{margin:4px 0 0;color:var(--mut);font-size:14.5px}
